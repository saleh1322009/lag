<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ja7eem OP - Hacker Style Page</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            font-family: 'Cairo', sans-serif;
            overflow-x: hidden;
        }
        .hacker-text {
            color: #ff0033;
            text-shadow: 0 0 8px rgba(255, 0, 51, 0.7), 0 0 20px rgba(255, 0, 51, 0.4);
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
        }
        .video-container {
            border: 3px solid #b91c1c;
            box-shadow: 0 0 25px rgba(220, 38, 38, 0.6), inset 0 0 15px rgba(147, 51, 234, 0.4);
            border-radius: 12px;
            overflow: hidden;
            background: #111;
        }
        /* Canvas for starry background */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
    </style>
</head>
<body class="min-h-screen text-white flex flex-col items-center justify-between p-4 sm:p-6">

    <!-- Starry background canvas -->
    <canvas id="starfield"></canvas>

    <!-- Main Container -->
    <main class="w-full max-w-2xl mx-auto flex flex-col items-center justify-center space-y-6 my-auto">

        <!-- Video Frame -->
        <div class="video-container w-full max-w-lg aspect-video relative flex items-center justify-center">
            <!-- Replace the src with your video link or local video file -->
            <video class="w-full h-full object-cover" autoplay muted loop playsinline id="mainVideo">
                <source src="https://www.youtube.com/watch?v=5r2SAg5FUg4" type="video/mp4">
                متصفحك لا يدعم عرض الفيديو.
            </video>
            <!-- Audio toggle button for interaction in case autoplay is blocked -->
            <button onclick="toggleAudio()" class="absolute bottom-3 left-3 bg-red-900/80 hover:bg-red-700 text-white text-xs px-2.5 py-1 rounded border border-red-500 transition shadow-lg">
                🔊 صوت
            </button>
        </div>

        <!-- Arabic Quote Banner -->
        <div class="text-center px-4">
            <h2 class="hacker-text text-lg sm:text-2xl md:text-3xl tracking-wide">
                اما توردها مواريد الابطال ولا استرح وخلي المراجل لاهلها
            </h2>
        </div>

        <!-- Information Fields (IP Logger style) -->
        <div class="w-full max-w-md bg-black/60 border border-red-900/50 backdrop-blur-sm rounded-lg p-5 space-y-2.5 text-sm sm:text-base shadow-2xl">
            <div class="flex justify-between border-b border-red-950 pb-1.5">
                <span class="hacker-text font-mono">IP:</span>
                <span id="ip-val" class="text-red-400 font-mono">جار التحميل...</span>
            </div>
            <div class="flex justify-between border-b border-red-950 pb-1.5">
                <span class="hacker-text font-mono">City:</span>
                <span id="city-val" class="text-red-400 font-mono">جار التحميل...</span>
            </div>
            <div class="flex justify-between border-b border-red-950 pb-1.5">
                <span class="hacker-text font-mono">Region:</span>
                <span id="region-val" class="text-red-400 font-mono">جار التحميل...</span>
            </div>
            <div class="flex justify-between border-b border-red-950 pb-1.5">
                <span class="hacker-text font-mono">Country:</span>
                <span id="country-val" class="text-red-400 font-mono">جار التحميل...</span>
            </div>
            <div class="flex justify-between border-b border-red-950 pb-1.5">
                <span class="hacker-text font-mono">Location:</span>
                <span id="loc-val" class="text-red-400 font-mono">جار التحميل...</span>
            </div>
            <div class="flex justify-between border-b border-red-950 pb-1.5">
                <span class="hacker-text font-mono">Organization:</span>
                <span id="org-val" class="text-red-400 font-mono truncate max-w-[200px]" title="">جار التحميل...</span>
            </div>
            <div class="flex justify-between">
                <span class="hacker-text font-mono">Timezone:</span>
                <span id="tz-val" class="text-red-400 font-mono">جار التحميل...</span>
            </div>
        </div>

    </main>

    <!-- Footer / Bottom Signature -->
    <footer class="w-full text-center py-4 mt-6">
        <p class="hacker-text text-sm sm:text-lg tracking-widest">
            GG : TEAM LAG OP :. <a href="https://discord.gg/ABOS" target="_blank" class="underline hover:text-white transition">discord.gg/ABOS</a>
        </p>
    </footer>

    <!-- Scripts for Starry Effect & IP Fetching -->
    <script>
        // Starry Background Animation
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];
        const numStars = 150;

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Create stars
        for (let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                radius: Math.random() * 1.5,
                alpha: Math.random(),
                speed: Math.random() * 0.2 + 0.05
            });
        }

        function animateStars() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#ffffff';

            stars.forEach(star => {
                ctx.globalAlpha = star.alpha;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();

                // Move star slowly downwards or twinkling
                star.y -= star.speed;
                if (star.y < 0) {
                    star.y = height;
                    star.x = Math.random() * width;
                }

                // Twinkle effect
                star.alpha += (Math.random() - 0.5) * 0.05;
                if (star.alpha < 0.1) star.alpha = 0.1;
                if (star.alpha > 1) star.alpha = 1;
            });

            requestAnimationFrame(animateStars);
        }

        animateStars();

        // Audio toggle function
        function toggleAudio() {
            const video = document.getElementById('mainVideo');
            video.muted = !video.muted;
        }

        // Fetch user IP and Geo details
        async function fetchIpInfo() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                
                document.getElementById('ip-val').textContent = data.ip || 'N/A';
                document.getElementById('city-val').textContent = data.city || 'N/A';
                document.getElementById('region-val').textContent = data.region || 'N/A';
                document.getElementById('country-val').textContent = data.country_name || 'N/A';
                document.getElementById('loc-val').textContent = `${data.latitude || ''}, ${data.longitude || ''}`;
                
                const orgElem = document.getElementById('org-val');
                orgElem.textContent = data.org || 'N/A';
                orgElem.title = data.org || '';

                document.getElementById('tz-val').textContent = data.timezone || 'N/A';
            } catch (error) {
                // Fallback simulation if API fails or blocks
                document.getElementById('ip-val').textContent = '127.0.0.1';
                document.getElementById('city-val').textContent = 'Riyadh';
                document.getElementById('region-val').textContent = 'Riyadh Province';
                document.getElementById('country-val').textContent = 'Saudi Arabia';
                document.getElementById('loc-val').textContent = '24.7136, 46.6753';
                document.getElementById('org-val').textContent = 'AS1234 Example Network';
                document.getElementById('tz-val').textContent = 'Asia/Riyadh';
            }
        }

        fetchIpInfo();
    </script>
</body>
</html>
